name: 神州租车云端监控

on:
  push:
    paths: [monitor.py, monitor_all.py, requirements.txt, test_monitor.py, .github/workflows/monitor.yml]
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 监控或测试推送
        type: choice
        required: true
        default: monitor
        options:
          - monitor
          - test_push
          - diagnose

permissions:
  contents: write

concurrency:
  group: zuche-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安全回归测试
        if: ${{ inputs.mode != 'test_push' }}
        run: python -m unittest -v test_monitor
      - name: 检查监控期限
        id: window
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime, timezone
          active = datetime.now(timezone.utc) < datetime(2026, 10, 18, 1, 0, tzinfo=timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          PYCODE
      - name: 安装查询依赖
        if: ${{ inputs.mode != 'test_push' && steps.window.outputs.active == 'true' }}
        run: python -m pip install -r requirements.txt
      - name: 检查网页并推送 Bark
        env:
          MODE: ${{ inputs.mode || 'monitor' }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python monitor_all.py
      - name: 保存去重状态
        if: ${{ always() && inputs.mode != 'test_push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json state_all.json
          if [ -f history.json ]; then git add history.json; fi
          if [ -f history_all.json ]; then git add history_all.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update watch state [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: 保存安全检查报告
        if: ${{ always() && inputs.mode != 'test_push' }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            check-result.json
            check-result-all.json
          if-no-files-found: warn
          retention-days: 14
